apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: praxis
  namespace: praxis
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: praxis.lamiphil.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: praxis
                port:
                  name: http
