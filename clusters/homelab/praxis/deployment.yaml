apiVersion: apps/v1
kind: Deployment
metadata:
  name: praxis
  namespace: praxis
  labels:
    app.kubernetes.io/name: praxis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: praxis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: praxis
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: praxis
          image: ghcr.io/lamiphil/praxis:0.1.3
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: praxis-secret
          env:
            - name: PRAXIS_SECURE_COOKIE
              value: "true"
            # Trust the username forwarded by Traefik's Authentik middleware.
            # Only safe because the Ingress is the single entry point and a
            # NetworkPolicy blocks every other pod from opening TCP/8080 here.
            - name: PRAXIS_TRUSTED_HEADER
              value: X-authentik-username
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: praxis-data
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
