apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: authentik
spec:
  interval: 30m
  chart:
    spec:
      chart: authentik
      version: "2026.8.5"
      sourceRef:
        kind: HelmRepository
        name: authentik
        namespace: authentik
      interval: 24h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    authentik:
      existingSecret:
        secretName: authentik-secret
    global:
      nodeSelector:
        kubernetes.io/hostname: datavault
      volumeMounts:
        - name: data
          mountPath: /data
      volumes:
        - name: data
          hostPath:
            path: /srv/authentik/data
            type: DirectoryOrCreate
    server:
      replicas: 1
      initContainers:
        - name: prepare-data
          image: busybox:1.37.0
          command: [sh, -c, "chown -R 1000:1000 /data"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN"]
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /data
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 1Gi
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-prod
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
        hosts:
          - auth.lamiphil.dev
        tls:
          - secretName: authentik-tls
            hosts:
              - auth.lamiphil.dev
    worker:
      replicas: 1
      initContainers:
        - name: prepare-data
          image: busybox:1.37.0
          command: [sh, -c, "chown -R 1000:1000 /data"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN"]
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /data
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 1Gi
    postgresql:
      enabled: false
