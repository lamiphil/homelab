apiVersion: batch/v1
kind: CronJob
metadata:
  name: authentik-backup
  namespace: authentik
spec:
  schedule: "0 4 * * *"
  timeZone: America/Toronto
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app.kubernetes.io/name: authentik-backup
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          nodeSelector:
            kubernetes.io/hostname: datavault
          securityContext:
            fsGroup: 70
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: dump
              image: postgres:18.1-alpine
              command:
                - sh
                - -ec
                - |
                  pg_dump                     --host=authentik-postgresql                     --username=authentik                     --dbname=authentik                     --format=custom                     --file=/backup/authentik.dump
                  pg_restore --list /backup/authentik.dump >/dev/null
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: authentik-secret
                      key: POSTGRES_PASSWORD
              securityContext:
                runAsNonRoot: true
                runAsUser: 70
                runAsGroup: 70
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              volumeMounts:
                - name: backup
                  mountPath: /backup
                - name: tmp
                  mountPath: /tmp
            - name: archive-data
              image: busybox:1.37.0
              command:
                - sh
                - -ec
                - |
                  tar -czf /backup/authentik-data.tar.gz -C /data .
                  tar -tzf /backup/authentik-data.tar.gz >/dev/null
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
              volumeMounts:
                - name: data
                  mountPath: /data
                  readOnly: true
                - name: backup
                  mountPath: /backup
                - name: tmp
                  mountPath: /tmp
          containers:
            - name: upload
              image: rclone/rclone:1.76.0
              command:
                - sh
                - -ec
                - |
                  timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
                  rclone copyto /backup/authentik.dump "r2:authentik-backups/authentik-${timestamp}.dump"
                  rclone copyto /backup/authentik-data.tar.gz "r2:authentik-backups/authentik-${timestamp}-data.tar.gz"
              env:
                - name: HOME
                  value: /tmp
                - name: RCLONE_CONFIG_R2_TYPE
                  value: s3
                - name: RCLONE_CONFIG_R2_PROVIDER
                  value: Cloudflare
                - name: RCLONE_CONFIG_R2_NO_CHECK_BUCKET
                  value: "true"
              envFrom:
                - secretRef:
                    name: authentik-backup-r2
              securityContext:
                runAsNonRoot: true
                runAsUser: 65532
                runAsGroup: 65532
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
              volumeMounts:
                - name: backup
                  mountPath: /backup
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: data
              hostPath:
                path: /srv/authentik/data
                type: Directory
            - name: backup
              emptyDir:
                sizeLimit: 2Gi
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi
