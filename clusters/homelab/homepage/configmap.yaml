apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
data:
  kubernetes.yaml: |
    mode: cluster
  settings.yaml: |
    background: https://unsplash.com/photos/a-faint-nebula-glows-against-a-starry-night-sky-9wGI-g3rA-E
  custom.css: ""
  custom.js: ""
  services.yaml: |
    - Applications:
        - Immich:
            icon: immich.svg
            href: https://immich.lamiphil.dev
        - File Browser:
            icon: filebrowser.svg
            href: https://filebrowser.lamiphil.dev
        - Praxis:
            icon: mdi-check-circle-outline
            href: https://praxis.lamiphil.dev

    - Monitoring:
        - Grafana:
            icon: grafana.svg
            href: https://grafana.lamiphil.dev/login
        - Prometheus:
            icon: prometheus.svg
            href: https://prometheus.lamiphil.dev
        - Alertmanager:
            icon: alertmanager.svg
            href: https://alertmanager.lamiphil.dev
  bookmarks.yaml: |
    - Reading:
        - TheNewStack:
            - href: https://thenewstack.io
              description: ""
        - Lobste.rs:
            - href: https://lobste.rs/active
              description: ""
    - Developer:
        - Github:
            - icon: github.svg
              href: https://github.com/lamiphil
              description: ""
        - ChatGPT:
            - icon: chatgpt.svg
              href: https://chatgpt.com
              description: ""

    - Entertainment:
        - Youtube:
            - icon: youtube.svg
              href: https://youtube.com
              description: ""
        - Soundcloud:
            - icon: mdi-soundcloud
              href: https://soundcloud.com
              description: ""
    - Communication:
        - Messenger:
            - icon: facebook-messenger.svg
              href: https://messenger.com
              description: ""

    - Infrastructure:
        - Cloudflare:
            - icon: cloudflare.svg
              href: https://dash.cloudflare.com
              description: ""
        - Cloudflare DNS:
            - icon: cloudflare.svg
              href: https://dash.cloudflare.com
              description: "lamiphil.dev zone"
        - Cloudflare R2:
            - icon: cloudflare.svg
              href: https://dash.cloudflare.com
              description: "praxis-backups · authentik-backups"
        - Fastmail:
            - icon: mail.svg
              href: https://app.fastmail.com
              description: "lamiphil.dev mailbox"
  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "cluster"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - resources:
        backend: resources
        expanded: true
        cpu: true
        memory: true
        network: default
    - search:
        provider: duckduckgo
        target: _blank
  docker.yaml: ""
