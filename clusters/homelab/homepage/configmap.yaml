apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
data:
  kubernetes.yaml: |
    mode: cluster
  settings.yaml: |
    background: https://unsplash.com/photos/a-faint-nebula-glows-against-a-starry-night-sky-9wGI-g3rA-E
  custom.css: ""
  custom.js: ""
  services.yaml: |
    - Monitoring:
        - Grafana:
            icon: grafana.svg
            href: http://grafana.homelab/login

    - Network:
        - Router:
            icon: mdi-router-network
            href: http://192.168.0.1
        - UniFi:
            icon: mdi-access-point-network
            href: https://unifi/network/default/dashboard
        - Tailscale:
            icon: tailscale.svg
            href: https://login.tailscale.com/admin/machines
        - ProtonVPN:
            icon: proton-vpn.svg
            href: https://account.proton.me/u/2/vpn/dashboardV2

    - Media:
        - Immich:
            icon: immich.svg
            href: http://immich.homelab:2283
        - File Browser:
            icon: filebrowser.svg
            href: http://filebrowser.homelab
  bookmarks.yaml: |
    - Reading:
        - TheNewStack:
            - href: https://thenewstack.io
              description: ""
        - Lobste.rs:
            - href: https://lobste.rs/active
              description: ""
    - Developer:
        - Github:
            - icon: github.svg
              href: https://github.com/lamiphil
              description: ""
        - ChatGPT:
            - icon: chatgpt.svg
              href: https://chatgpt.com
              description: ""

    - Entertainment:
        - Youtube:
            - icon: youtube.svg
              href: https://youtube.com
              description: ""
        - Soundcloud:
            - icon: mdi-soundcloud
              href: https://soundcloud.com
              description: ""
    - Communication:
        - Messenger:
            - icon: facebook-messenger.svg
              href: https://messenger.com
              description: ""
  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "cluster"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - resources:
        backend: resources
        expanded: true
        cpu: true
        memory: true
        network: default
    - search:
        provider: duckduckgo
        target: _blank
  docker.yaml: ""
