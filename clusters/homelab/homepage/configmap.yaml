apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
data:
  kubernetes.yaml: |
    mode: cluster
  settings.yaml: |
    title: Homelab
    headerStyle: clean
    background:
      image: https://images.unsplash.com/photo-1534796636912-3b95b3ab5986?auto=format&fit=crop&w=2560&q=80
      blur: sm
      saturate: 50
      brightness: 50
      opacity: 60
    color: slate
    theme: dark
    layout:
      Applications:
        style: row
        columns: 3
      Monitoring:
        style: row
        columns: 3
      Identity:
        style: row
        columns: 2
      Infrastructure:
        style: row
        columns: 4
    quicklaunch:
      searchDescriptions: true
      hideInternetSearch: false
      showSearchSuggestions: true
      hideVisitURL: false
    statusStyle: dot
    hideErrors: false
    useEqualHeights: true
  custom.css: ""
  custom.js: ""
  services.yaml: |
    - Applications:
        - Immich:
            icon: immich.svg
            href: https://immich.lamiphil.dev
            description: Photos et vidéos
            server: my-cluster
            namespace: immich
            app: immich-server
        - File Browser:
            icon: filebrowser.svg
            href: https://filebrowser.lamiphil.dev
            description: /srv/media/Documents
            server: my-cluster
            namespace: filebrowser
            app: filebrowser
        - Praxis:
            icon: mdi-check-circle-outline
            href: https://praxis.lamiphil.dev
            description: Suivi d'habitudes
            server: my-cluster
            namespace: praxis
            app: praxis

    - Monitoring:
        - Grafana:
            icon: grafana.svg
            href: https://grafana.lamiphil.dev
            description: Dashboards et métriques
            server: my-cluster
            namespace: monitoring
            app.kubernetes.io/name: grafana
        - Prometheus:
            icon: prometheus.svg
            href: https://prometheus.lamiphil.dev
            description: Métriques
            server: my-cluster
            namespace: monitoring
            app.kubernetes.io/name: prometheus
        - Alertmanager:
            icon: alertmanager.svg
            href: https://alertmanager.lamiphil.dev
            description: Alertes
            server: my-cluster
            namespace: monitoring
            app.kubernetes.io/name: alertmanager

    - Identity:
        - Authentik:
            icon: authentik.svg
            href: https://auth.lamiphil.dev
            description: SSO et comptes
            server: my-cluster
            namespace: authentik
            app: authentik

    - Infrastructure:
        - Cloudflare:
            icon: cloudflare.svg
            href: https://dash.cloudflare.com
            description: Dashboard
        - Cloudflare DNS:
            icon: cloudflare.svg
            href: https://dash.cloudflare.com
            description: Zone lamiphil.dev
        - Cloudflare R2:
            icon: cloudflare.svg
            href: https://grafana.lamiphil.dev/d/homelab-r2-backups
            description: Dashboard R2 Backups
        - Fastmail:
            icon: mail.svg
            href: https://app.fastmail.com
            description: Mailbox lamiphil.dev
  bookmarks.yaml: |
    - Reading:
        - TheNewStack:
            - href: https://thenewstack.io
              description: ""
        - Lobste.rs:
            - href: https://lobste.rs/active
              description: ""
    - Developer:
        - Github:
            - icon: github.svg
              href: https://github.com/lamiphil
              description: ""
        - ChatGPT:
            - icon: chatgpt.svg
              href: https://chatgpt.com
              description: ""

    - Entertainment:
        - Youtube:
            - icon: youtube.svg
              href: https://youtube.com
              description: ""
        - Soundcloud:
            - icon: mdi-soundcloud
              href: https://soundcloud.com
              description: ""
    - Communication:
        - Messenger:
            - icon: facebook-messenger.svg
              href: https://messenger.com
              description: ""
  widgets.yaml: |
    - datetime:
        text_size: xl
        format:
          timeStyle: short
          dateStyle: short
          hourCycle: h23
    - search:
        provider: duckduckgo
        target: _blank
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: cluster
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - resources:
        backend: kubernetes
        expanded: true
        label: cluster
        cpu: true
        memory: true
  docker.yaml: ""
