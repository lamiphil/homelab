apiVersion: apps/v1
kind: Deployment
metadata:
  name: filebrowser
  namespace: filebrowser
  labels:
    app.kubernetes.io/name: filebrowser
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: filebrowser
  template:
    metadata:
      labels:
        app.kubernetes.io/name: filebrowser
    spec:
      nodeSelector:
        kubernetes.io/hostname: minipc
      initContainers:
        # Switch the server to Authentik ForwardAuth and keep the admin user in
        # sync. BoltDB locks the file while the server runs, so this must happen
        # before the main container starts. The script is idempotent so Flux can
        # re-run it every time the pod is replaced.
        - name: configure-proxy-auth
          image: filebrowser/filebrowser:s6
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -eu
              DB=/database/filebrowser.db
              FB="filebrowser -d $DB"
              current=$($FB users ls 2>/dev/null | awk 'NR>1 && $1=="1" {print $2; exit}')
              if [ "$current" = "admin" ]; then
                $FB users update 1 --username lamiphil
                echo "renamed user 1 admin -> lamiphil"
              fi
              $FB config set --auth.method=proxy --auth.header=X-authentik-username
              echo "auth method set to proxy (header X-authentik-username)"
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: database
              mountPath: /database
      containers:
        - name: filebrowser
          image: filebrowser/filebrowser:s6
          imagePullPolicy: IfNotPresent
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "America/Toronto"
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          volumeMounts:
            # Only the Documents folder; the rest of /srv/media (Immich library) stays hidden.
            - name: media
              mountPath: /srv
              subPath: Documents
            - name: database
              mountPath: /database
            - name: config
              mountPath: /config
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: filebrowser-media
        - name: database
          hostPath:
            path: /srv/filebrowser/database
            type: DirectoryOrCreate
        - name: config
          hostPath:
            path: /srv/filebrowser/config
            type: DirectoryOrCreate
