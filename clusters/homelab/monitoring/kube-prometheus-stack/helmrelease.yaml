apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "79.5.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system

  install:
    remediation:
      retries: 3

  upgrade:
    remediation:
      retries: 3

  valuesFrom:
    - kind: Secret 
      name: grafana-admin
      valuesKey: adminPassword
      targetPath: grafana.adminPassword

  values:
    grafana:
      defaultDashboardsEnabled: false
      service:
        type: LoadBalancer
        loadBalancerIP: 192.168.42.70
      defaultDashboardsTimezone: "America/Montreal"
      adminUser: "lamiphil"

      # Praxis habit reporting: Grafana reads the live SQLite file read-only,
      # so it must run on the node that holds /srv/praxis.
      nodeSelector:
        kubernetes.io/hostname: datavault
      securityContext:
        supplementalGroups: [65532]
      grafana.ini:
        plugins:
          preinstall_sync: frser-sqlite-datasource@4.0.6
      extraVolumes:
        - name: praxis-data
          existingClaim: praxis-data-grafana
      extraVolumeMounts:
        - name: praxis-data
          mountPath: /var/lib/praxis
          readOnly: true
      additionalDataSources:
        - name: Praxis
          uid: praxis-sqlite
          type: frser-sqlite-datasource
          access: proxy
          editable: false
          jsonData:
            path: /var/lib/praxis/praxis.db
            pathOptions: mode=ro

    prometheus:
      service:
        type: ClusterIP

    alertmanager:
      service:
        type: ClusterIP

    nodeExporter:
      nodeSelector: {}
