apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "79.5.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system

  install:
    remediation:
      retries: 3

  upgrade:
    remediation:
      retries: 3

  valuesFrom:
    - kind: Secret 
      name: grafana-admin
      valuesKey: adminPassword
      targetPath: grafana.adminPassword

  values:
    grafana:
      defaultDashboardsEnabled: false
      service:
        type: ClusterIP
      defaultDashboardsTimezone: "America/Montreal"
      adminUser: "lamiphil"

      # Praxis habit reporting: Grafana reads the live SQLite file read-only,
      # so it must run on the node that holds /srv/praxis.
      nodeSelector:
        kubernetes.io/hostname: datavault
      securityContext:
        supplementalGroups: [65532]
      # Authentik OIDC client ID and secret (GF_AUTH_GENERIC_OAUTH_CLIENT_*)
      # and the Cloudflare account-analytics token read by the Infinity
      # datasource at provisioning time ($CLOUDFLARE_API_TOKEN).
      envFromSecrets:
        - name: grafana-oidc
        - name: grafana-cloudflare-r2
      grafana.ini:
        plugins:
          preinstall_sync: frser-sqlite-datasource@4.0.6,yesoreyeram-infinity-datasource@3.11.1
        server:
          root_url: https://grafana.lamiphil.dev
        security:
          # Grafana storage is ephemeral: the local admin is recreated on each
          # start. Its email matches the Authentik user so SSO links to it.
          admin_email: philippe.lamy@lamiphil.dev
        auth:
          oauth_allow_insecure_email_lookup: true
          signout_redirect_url: https://auth.lamiphil.dev/application/o/grafana/end-session/
        auth.generic_oauth:
          enabled: true
          name: Authentik
          allow_sign_up: true
          use_pkce: true
          scopes: openid profile email
          auth_url: https://auth.lamiphil.dev/application/o/authorize/
          token_url: https://auth.lamiphil.dev/application/o/token/
          api_url: https://auth.lamiphil.dev/application/o/userinfo/
          login_attribute_path: preferred_username
          email_attribute_path: email
          name_attribute_path: name
          role_attribute_path: contains(groups[*], 'homelab-users') && 'Admin' || 'Viewer'
          role_attribute_strict: false
      extraVolumes:
        - name: praxis-data
          existingClaim: praxis-data-grafana
      extraVolumeMounts:
        - name: praxis-data
          mountPath: /var/lib/praxis
          readOnly: true
      additionalDataSources:
        - name: Praxis
          uid: praxis-sqlite
          type: frser-sqlite-datasource
          access: proxy
          editable: false
          jsonData:
            path: /var/lib/praxis/praxis.db
            pathOptions: mode=ro
        # Cloudflare GraphQL Analytics API, used by the R2 backups dashboard.
        # The token comes from the grafana-cloudflare-r2 Secret and Grafana
        # substitutes $CLOUDFLARE_API_TOKEN at provisioning time.
        - name: Cloudflare R2
          uid: cloudflare-r2
          type: yesoreyeram-infinity-datasource
          access: proxy
          url: https://api.cloudflare.com/client/v4/graphql
          editable: false
          jsonData:
            allowedHosts:
              - https://api.cloudflare.com
            httpHeaderName1: Authorization
          secureJsonData:
            httpHeaderValue1: Bearer $CLOUDFLARE_API_TOKEN

    prometheus:
      service:
        type: ClusterIP

    alertmanager:
      service:
        type: ClusterIP

    nodeExporter:
      nodeSelector: {}
