              "queryType": "table",
              "rawQueryText": "SELECT ROUND(AVG(sleep_minutes) / 60.0, 2) AS \"Heures\" FROM days WHERE date BETWEEN '${__from:date:YYYY-MM-DD}' AND '${__to:date:YYYY-MM-DD}' AND sleep_minutes IS NOT NULL",
              "queryText": "SELECT ROUND(AVG(sleep_minutes) / 60.0, 2) AS \"Heures\" FROM days WHERE date BETWEEN '${__from:date:YYYY-MM-DD}' AND '${__to:date:YYYY-MM-DD}' AND sleep_minutes IS NOT NULL",
