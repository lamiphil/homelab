              "rawQueryText": "SELECT date || 'T12:00:00Z' AS time, sleep_minutes / 60.0 AS \"Sommeil (h)\" FROM days WHERE date BETWEEN '${__from:date:YYYY-MM-DD}' AND '${__to:date:YYYY-MM-DD}' AND sleep_minutes IS NOT NULL ORDER BY date",
              "queryText": "SELECT date || 'T12:00:00Z' AS time, sleep_minutes / 60.0 AS \"Sommeil (h)\" FROM days WHERE date BETWEEN '${__from:date:YYYY-MM-DD}' AND '${__to:date:YYYY-MM-DD}' AND sleep_minutes IS NOT NULL ORDER BY date",
