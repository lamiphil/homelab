              "queryText": "SELECT ROUND(AVG(coffee_count), 2) AS \"Cafés\" FROM days WHERE date BETWEEN '${__from:date:YYYY-MM-DD}' AND '${__to:date:YYYY-MM-DD}' AND coffee_count IS NOT NULL",
