            "wideLayout": true
          }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "${measurement:text}${unit_suffix}",
          "description": "Valeur par jour. Les lignes pointillées sont les bornes d’objectif définies dans Praxis.",
          "gridPos": {
            "x": 0,
            "y": 29,
            "w": 24,
            "h": 9
          },
          "datasource": {
            "type": "frser-sqlite-datasource",
            "uid": "praxis-sqlite"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "frser-sqlite-datasource",
                "uid": "praxis-sqlite"
              },
              "queryType": "table",
              "rawQueryText": "SELECT v.day_date || 'T12:00:00Z' AS time, v.value AS \"Valeur\", m.target_min AS \"Objectif min\", m.target_max AS \"Objectif max\" FROM measurement_values v JOIN measurements m ON m.id = v.measurement_id WHERE m.key = '${measurement}' AND v.day_date BETWEEN '${__from:date:YYYY-MM-DD}' AND '${__to:date:YYYY-MM-DD}' ORDER BY v.day_date",
              "queryText": "SELECT v.day_date || 'T12:00:00Z' AS time, v.value AS \"Valeur\", m.target_min AS \"Objectif min\", m.target_max AS \"Objectif max\" FROM measurement_values v JOIN measurements m ON m.id = v.measurement_id WHERE m.key = '${measurement}' AND v.day_date BETWEEN '${__from:date:YYYY-MM-DD}' AND '${__to:date:YYYY-MM-DD}' ORDER BY v.day_date",
              "timeColumns": [
                "time"
              ]
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 2,
              "color": {
                "mode": "fixed",
                "fixedColor": "green"
              },
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "always",
                "pointSize": 6,
                "spanNulls": false,
                "insertNulls": 129600000
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byRegexp",
                  "options": "Objectif.*"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "text"
                    }
                  },
                  {
                    "id": "custom.lineStyle",
                    "value": {
                      "fill": "dash",
                      "dash": [
                        10,
                        10
                      ]
                    }
                  },
                  {
                    "id": "custom.fillOpacity",
                    "value": 0
                  },
                  {
                    "id": "custom.showPoints",
                    "value": "never"
                  },
                  {
                    "id": "custom.lineWidth",
                    "value": 1
                  },
                  {
                    "id": "custom.spanNulls",
                    "value": true
                  },
                  {
                    "id": "custom.insertNulls",
                    "value": false
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          }
        }
      ],
      "refresh": "",
      "schemaVersion": 39,
      "templating": {
